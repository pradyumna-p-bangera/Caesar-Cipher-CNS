<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Demonstration - CNS Assignment</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #34495e; }
        textarea, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        .output-box { margin-top: 20px; background: #e8f4f8; padding: 15px; border-left: 5px solid #3498db; border-radius: 4px; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>Caesar Cipher Implementation</h2>
    <p style="text-align: center; color: #7f8c8d;">Cryptography & Network Security Lab</p>

    <label for="inputText">Enter Text:</label>
    <textarea id="inputText" rows="3" placeholder="Type your message here..."></textarea>

    <label for="shiftKey">Shift Key (0-25):</label>
    <input type="number" id="shiftKey" value="3" min="0" max="25">

    <div class="btn-group">
        <button onclick="processCipher('encrypt')">Encrypt</button>
        <button onclick="processCipher('decrypt')">Decrypt</button>
    </div>

    <div class="output-box">
        <strong>Result:</strong>
        <p id="outputResult" style="margin: 5px 0 0 0; font-family: monospace; font-size: 16px;"></p>
    </div>
</div>

<script>
function caesar(text, shift, mode) {
    let result = "";
    if (mode === 'decrypt') {
        shift = (26 - (shift % 26)) % 26;
    }
    for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char.match(/[a-z]/i)) {
            let code = text.charCodeAt(i);
            if (code >= 65 && code <= 90) {
                char = String.fromCharCode(((code - 65 + shift) % 26) + 65);
            } else if (code >= 97 && code <= 122) {
                char = String.fromCharCode(((code - 97 + shift) % 26) + 97);
            }
        }
        result += char;
    }
    return result;
}

function processCipher(mode) {
    const text = document.getElementById('inputText').value;
    const shift = parseInt(document.getElementById('shiftKey').value) || 0;
    const output = caesar(text, shift, mode);
    document.getElementById('outputResultinnerText'] = output;
    document.getElementById('outputResult').innerText = output;
}
</script>

</body>
</html>
