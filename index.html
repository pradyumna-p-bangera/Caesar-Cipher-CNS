
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Implementation</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 30px #0004;
        }

        h1 { text-align: center; color: #243b55; }
        .subtitle { text-align: center; color: #666; }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        textarea, input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea { min-height: 120px; resize: vertical; }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background: #243b55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #141e30; }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #edf5ff;
            border-left: 5px solid #243b55;
            border-radius: 7px;
            overflow-wrap: anywhere;
        }

        #resultText { white-space: pre-wrap; }
        .copy { background: #167d58; }
        .note { text-align: center; color: #777; font-size: 12px; }
    </style>
</head>

<body>
<div class="container">
    <h1>Caesar Cipher</h1>
    <p class="subtitle">Encrypt and decrypt messages using a shift cipher.</p>

    <form id="cipherForm">
        <label for="message">Enter your message</label>
        <textarea id="message" placeholder="Type your message..." required></textarea>

        <label for="shift">Shift value (0–25)</label>
        <input type="number" id="shift" min="0" max="25" value="3" required>

        <label for="mode">Choose operation</label>
        <select id="mode">
            <option value="encrypt">Encrypt</option>
            <option value="decrypt">Decrypt</option>
        </select>

        <button type="submit">Process Message</button>
    </form>

    <div class="result" id="resultBox" hidden>
        <h3>Result</h3>
        <p id="resultText"></p>
        <button type="button" class="copy" id="copyButton">Copy Result</button>
    </div>

    <p class="note">Educational demonstration of the Caesar cipher.</p>
</div>

<script>
    function caesarCipher(text, shift, mode) {
        if (mode === "decrypt") shift = -shift;

        return Array.from(text).map(char => {
            const code = char.charCodeAt(0);

            if (code >= 65 && code <= 90) {
                return String.fromCharCode(
                    ((code - 65 + shift + 26) % 26) + 65
                );
            }

            if (code >= 97 && code <= 122) {
                return String.fromCharCode(
                    ((code - 97 + shift + 26) % 26) + 97
                );
            }

            return char;
        }).join("");
    }

    document.getElementById("cipherForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const message = document.getElementById("message").value;
        const shift = Number(document.getElementById("shift").value);
        const mode = document.getElementById("mode").value;

        if (!Number.isInteger(shift) || shift < 0 || shift > 25) {
            alert("Enter a shift value between 0 and 25.");
            return;
        }

        document.getElementById("resultText").textContent =
            caesarCipher(message, shift, mode);

        document.getElementById("resultBox").hidden = false;
    });

    document.getElementById("copyButton").addEventListener("click", async function() {
        const text = document.getElementById("resultText").textContent;

        try {
            await navigator.clipboard.writeText(text);
            alert("Result copied!");
        } catch {
            alert("Copy failed. Please select and copy the result manually.");
        }
    });
</script>
</body>
</html>
